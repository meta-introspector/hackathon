[package]
name = "combinator-universe"
version = "0.1.0"
edition = "2021"

[dependencies]
dioxus = "0.5"
dioxus-web = "0.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["console"] }

[lib]
crate-type = ["cdylib", "rlib"]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
